<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f4f5;
        --fg: #18181b;
        --muted: #71717a;
        --error: #b91c1c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #18181b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --error: #fca5a5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--fg);
        font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      canvas {
        max-width: 100%;
        height: auto;
        image-rendering: pixelated;
      }
      p {
        margin: 0;
        color: var(--muted);
        text-align: center;
      }
      p.error {
        color: var(--error);
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="675" height="669"></canvas>
    <p id="status">connecting…</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
